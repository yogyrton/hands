    </filter>
  </defs>
  <circle cx="120" cy="120" r="114" fill="url(#disc)" stroke="#0d0a08" stroke-width="6"/>
  <circle cx="120" cy="120" r="114" fill="none" stroke="rgba(233,227,216,0.06)" stroke-width="1"/>
  <text x="120" y="132" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#F6EFE2" filter="url(#glow)">HANDS</text>

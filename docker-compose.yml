version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hands-app
        user: "0:0"
        working_dir: /app
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/app
        environment:
            WEB_DOCUMENT_ROOT: /app/public
            WEB_DOCUMENT_INDEX: index.php
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - hands-network

    mysql:
        image: mysql:8.0
        container_name: hands-mysql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-hands}
            MYSQL_USER: ${DB_USERNAME:-hands}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
        volumes:
            - hands_mysql_data:/var/lib/mysql
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            - hands-network

    redis:
        image: redis:7-alpine
        container_name: hands-redis
        ports:
            - "6379:6379"
        networks:
            - hands-network

    mailhog:
        image: mailhog/mailhog
        container_name: hands-mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - hands-network

networks:
    hands-network:
        driver: bridge

volumes:
    hands_mysql_data:

version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hands-app
        user: "0:0"
        working_dir: /app
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/app
        environment:
            WEB_DOCUMENT_ROOT: /app/public
            WEB_DOCUMENT_INDEX: index.php
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - hands-network

    pgsql:
        image: postgres:16-alpine
        container_name: hands-pgsql
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - hands_pgsql_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            - hands-network

    redis:
        image: redis:7-alpine
        container_name: hands-redis
        ports:
            - "6379:6379"
        networks:
            - hands-network

    mailhog:
        image: mailhog/mailhog
        container_name: hands-mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - hands-network

networks:
    hands-network:
        driver: bridge

volumes:
    hands_pgsql_data:
